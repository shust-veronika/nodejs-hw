<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
  </head>

  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
    <table role="presentation" style="width:100%; border-collapse:collapse;">
      <tr>
        <td align="center" style="padding:40px 0;">

          <table role="presentation" style="width:600px; background:#ffffff; border-radius:8px; padding:30px;">

            <tr>
              <td style="text-align:center;">
                <h2 style="color:#333333; margin-bottom:20px;">
                  Password Reset Request
                </h2>

                <p style="color:#555555; font-size:16px;">
                  Hello, {{name}}
                </p>

                <p style="color:#555555; font-size:16px;">
                  We received a request to reset your password. Click the button below to continue:
                </p>

                <a href="{{link}}"
                   style="
                    display:inline-block;
                    margin-top:20px;
                    padding:12px 24px;
                    background-color:#4f46e5;
                    color:#ffffff;
                    text-decoration:none;
                    border-radius:6px;
                    font-weight:bold;
                   ">
                  Reset Password
                </a>

                <p style="margin-top:30px; font-size:12px; color:#888888;">
                  This link is valid for 15 minutes. If you didn’t request this, you can ignore this email.
                </p>

                <p style="font-size:12px; color:#aaa;">
                  © Your App
                </p>

              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
